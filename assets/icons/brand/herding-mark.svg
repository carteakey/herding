    <path d="M 3.2 9.2 L 5.4 12 L 3.2 14.8" opacity="0.45"/>
    <path d="M 6.8 9.2 L 9 12 L 6.8 14.8" opacity="0.68"/>
    <path d="M 10.4 9.2 L 12.6 12 L 10.4 14.8"/>
  </g>
